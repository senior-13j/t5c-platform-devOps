<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link rel="stylesheet" href="/docs/styles.css" />

    <body>
        <aside class="sidebar">

                    <strong>The 5th Continent</strong>

                </span>

            <nav class="nav" aria-label="Documentation sections">
